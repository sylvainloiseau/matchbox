# Create native installers (jpackage runs jlink) on push of semantic tags (e.g., v1.0.0).
# Each OS builds in parallel and attaches its binaries to the GitHub release of the tag.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.runner }} (${{ matrix.javafx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            javafx: linux
          - runner: windows-latest
            javafx: win
          - runner: macos-latest
            javafx: mac-aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Maven 3.9.9
        shell: bash
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz" | tar xz -C /tmp
          echo "/tmp/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      # one build of all the modules, distribution included (jpackage writes build/target/installer).
      # Do not rebuild the distribution with clean afterwards: on Windows the new .exe is still
      # locked (antivirus scan) and cannot be deleted.
      - name: Build, test and package
        shell: bash
        run: mvn install

      # the detailed test results, to debug a build that fails on one OS only
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.runner }}
          path: '**/target/surefire-reports/'

      - name: Publish artifacts on the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            build/target/installer/*
